<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adoption Cursor AI — Báo cáo quản lý</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #1e1e1e;
      --surface: #252526;
      --border: #3c3c3c;
      --text: #e4e4e4;
      --muted: #9d9d9d;
      --accent: #3794ff;
      --info-bg: rgba(55, 148, 255, 0.12);
      --warn-bg: rgba(204, 120, 50, 0.15);
      --warn-border: #cc7832;
      --font: "Segoe UI", system-ui, sans-serif;
      --font-ja: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #0066cc;
      --info-bg: rgba(0, 102, 204, 0.08);
      --warn-bg: rgba(204, 120, 50, 0.1);
    }
    [data-lang="ja"] body { font-family: var(--font-ja), var(--font); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
    header { margin-bottom: 20px; padding-right: 200px; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
    .meta { color: var(--muted); font-size: 13px; }
    .toolbar {
      float: right;
      margin-top: -36px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .toolbar button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .toolbar button:hover { border-color: var(--accent); }
    .toolbar button.active { border-color: var(--accent); background: var(--info-bg); }
    h2 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
    .callout {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 16px 0;
      background: var(--surface);
    }
    .callout.info { border-left: 3px solid var(--accent); background: var(--info-bg); }
    .callout.warn { border-left: 3px solid var(--warn-border); background: var(--warn-bg); }
    .callout-title { font-weight: 600; margin-bottom: 8px; }
    .callout p { margin: 0 0 8px; font-size: 13px; }
    .callout p:last-child { margin-bottom: 0; }
    .note { font-size: 13px; color: var(--muted); margin: 8px 0; }
    .note strong { color: var(--text); }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) {
      .grid-2 { grid-template-columns: 1fr; }
      header { padding-right: 0; }
      .toolbar { float: none; margin: 0 0 12px; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-h { padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--border); font-size: 13px; }
    .card-b { padding: 14px; }
    .chart-box { position: relative; height: 220px; }
    .chart-box.sm { height: 200px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }
    th { background: var(--bg); font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    details { margin-top: 24px; font-size: 13px; color: var(--muted); }
    details summary { cursor: pointer; color: var(--text); font-weight: 600; }
    details ul { padding-left: 20px; }
    @media print {
      .toolbar { display: none; }
      body { background: #fff; color: #000; }
      .card, .callout { break-inside: avoid; }
    }
  </style>
</head>
<body data-theme="dark" data-lang="vi">
  <div class="wrap">
    <div class="toolbar">
      <button type="button" id="langVi" class="active">Tiếng Việt</button>
      <button type="button" id="langJa">日本語</button>

      <h1 id="txtTitle"></h1>

    </header>

    <div class="callout info">

      <p id="txtConclusion2"></p>

    <h2 id="txtSec1"></h2>
    <div class="grid-2">
      <div class="card">
        <div class="card-h" id="txtChartMonthlyH"></div>
        <div class="card-b">
          <div class="chart-box"><canvas id="chartMonthly"></canvas></div>
          <p class="note" id="txtChartMonthlyN"></p>

      </div>
      <div class="card">
        <div class="card-h" id="txtChartIntensityH"></div>

          <div class="chart-box sm"><canvas id="chartIntensity"></canvas></div>
          <p class="note" id="txtChartIntensityN"></p>
        </div>
      </div>
    </div>

    <h2 id="txtSec2"></h2>
    <p class="note" id="txtCalc"></p>
    <p class="note" id="txtRank"></p>
    <p class="note" id="txtSec2Detail"></p>

    <div class="card" style="margin-top:12px">
      <div class="card-h" id="txtTopH"></div>
      <div class="card-b" style="overflow-x:auto">
        <table id="tblTop"></table>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-h" id="txtBottomH"></div>
      <div class="card-b" style="overflow-x:auto">

      </div>

    <h2 id="txtSec3"></h2>
    <div class="card">
      <div class="card-b grid-2" style="align-items:center">
        <div class="chart-box sm"><canvas id="chartModel"></canvas></div>
        <div>
          <p style="margin:0 0 8px;font-size:13px" id="txtModel1"></p>
          <p class="note" id="txtModel2"></p>
        </div>
      </div>
    </div>

    <h2 id="txtSec4"></h2>
    <p class="note" id="txtSec4Note"></p>
    <div class="callout warn">
      <div class="callout-title" id="txtWarnTitle"></div>
      <p id="txtWarnBody"></p>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-h" id="txtLimitPieH"></div>
        <div class="card-b">
          <div class="chart-box sm"><canvas id="chartLimitPie"></canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h" id="txtLimitWeekH"></div>
        <div class="card-b">
          <div class="chart-box sm"><canvas id="chartLimitWeek"></canvas></div>
          <p class="note" id="txtLimitWeekN"></p>
        </div>
      </div>
    </div>

    <details>
      <summary id="txtAppendixTitle"></summary>
      <ul id="txtAppendixList"></ul>
    </details>
  </div>

    let lang = "vi";
    const charts = [];

    function L() { return I18N[lang]; }

    function setHtml(id, html) {
      document.getElementById(id).innerHTML = html;
    }

    function applyStaticText() {
      const t = L();
      document.title = t.docTitle;
      document.documentElement.lang = lang === "ja" ? "ja" : "vi";
      document.body.setAttribute("data-lang", lang);
      setHtml("txtTitle", t.title);
      setHtml("txtMeta", t.meta);
      setHtml("txtConclusionTitle", t.conclusionTitle);
      setHtml("txtConclusion1", t.conclusion1);
      setHtml("txtConclusion2", t.conclusion2);
      setHtml("txtSec1", t.sec1);
      setHtml("txtChartMonthlyH", t.chartMonthlyH);
      setHtml("txtChartMonthlyN", t.chartMonthlyN);
      setHtml("txtChartIntensityH", t.chartIntensityH);
      setHtml("txtChartIntensityN", t.chartIntensityN);
      setHtml("txtSec2", t.sec2);
      setHtml("txtCalc", t.calc);
      setHtml("txtRank", t.rank);
      setHtml("txtSec2Detail", t.sec2Detail);
      setHtml("txtTopH", t.topH);
      setHtml("txtBottomH", t.bottomH);
      setHtml("txtSec3", t.sec3);
      setHtml("txtModel1", t.model1);
      setHtml("txtModel2", t.model2);
      setHtml("txtSec4", t.sec4);
      setHtml("txtSec4Note", t.sec4Note);
      setHtml("txtWarnTitle", t.warnTitle);
      setHtml("txtWarnBody", t.warnBody);
      setHtml("txtLimitPieH", t.limitPieH);
      setHtml("txtLimitWeekH", t.limitWeekH);
      setHtml("txtLimitWeekN", t.limitWeekN);
      setHtml("txtAppendixTitle", t.appendixTitle);
      document.getElementById("txtAppendixList").innerHTML =
        t.appendixItems.map((li) => "<li>" + li + "</li>").join("");
      updateThemeBtnLabel();
    }

    function renderTables() {
      const headers = L().tableHeaders;
      function renderTable(id, rows) {
        const el = document.getElementById(id);
        el.innerHTML =
          "<thead><tr>" + headers.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead>" +
          "<tbody>" +
          rows.map((r) =>
            "<tr>" + r.map((c, i) => {
              const cls = i >= 3 ? " num" : "";
              return "<td class=\"" + cls.trim() + "\">" + c + "</td>";
            }).join("") + "</tr>"
          ).join("") +
          "</tbody>";
      }
      renderTable("tblTop", TOP5);
      renderTable("tblBottom", BOTTOM5);
    }

    const gridColor = () =>
      document.body.getAttribute("data-theme") === "light" ? "#ccc" : "#444";
    const textColor = () =>
      document.body.getAttribute("data-theme") === "light" ? "#333" : "#ccc";

    function baseOptions(extra) {
      return Object.assign({
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: textColor() } } },
        scales: extra && extra.scales
          ? Object.fromEntries(
              Object.entries(extra.scales).map(([k, v]) => [
                k,
                Object.assign({}, v, {
                  ticks: Object.assign({}, v.ticks, { color: textColor() }),
                  grid: Object.assign({}, v.grid, { color: gridColor() }),
                }),
              ])
            )
          : undefined,
      }, extra || {});
    }

    function buildCharts() {
      const t = L();
      charts.forEach((c) => c.destroy());
      charts.length = 0;

      charts.push(new Chart(document.getElementById("chartMonthly"), {
        type: "line",
        data: {
          labels: ["01/26","02/26","03/26","04/26","05/26","06/26","07/26","08/26","09/26"],
          datasets: [{
            label: t.chartMonthlyLabel,
            data: [2230,8032,16260,16704,15238,24822,29552,29602,11388],
            borderColor: "#3794ff",
            backgroundColor: "rgba(55,148,255,0.15)",
            fill: true,
            tension: 0.2,
          }],
        },
        options: baseOptions({
          scales: {
            y: { beginAtZero: true, ticks: {}, grid: {} },
            x: { ticks: {}, grid: { display: false } },
          },
        }),
      }));

      charts.push(new Chart(document.getElementById("chartIntensity"), {
        type: "bar",
        data: {
          labels: t.chartIntensityLabels,
          datasets: [{
            label: t.chartIntensitySeries,
            data: [465, 891],
            backgroundColor: "#3794ff",
          }],
        },
        options: baseOptions({
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: {}, grid: {} }, x: { ticks: {}, grid: { display: false } } },
        }),
      }));

      charts.push(new Chart(document.getElementById("chartModel"), {
        type: "doughnut",
        data: {
          labels: ["auto","composer-2.5-fast","composer-2.5", t.modelOther],
          datasets: [{
            data: [82.4, 12.3, 3.6, 1.7],
            backgroundColor: ["#3794ff","#4ec9b0","#d19a66","#888"],
          }],
        },
        options: baseOptions({ plugins: { legend: { position: "bottom" } } }),
      }));

      charts.push(new Chart(document.getElementById("chartLimitPie"), {
        type: "doughnut",
        data: {
          labels: t.limitPieLabels,
          datasets: [{
            data: [10, 31],
            backgroundColor: ["#d19a66", "#4ec9b0"],
          }],
        },
        options: baseOptions({ plugins: { legend: { position: "bottom" } } }),
      }));

      charts.push(new Chart(document.getElementById("chartLimitWeek"), {
        type: "bar",
        data: {
          labels: t.limitWeekLabels,
          datasets: [{
            label: t.limitWeekSeries,
            data: [0, 2, 4, 5],
            backgroundColor: "#d19a66",
          }],
        },
        options: baseOptions({
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: {} }, x: { ticks: {}, grid: { display: false } } },
        }),
      }));
    }

    function setLang(next) {
      lang = next;
      document.getElementById("langVi").classList.toggle("active", lang === "vi");
      document.getElementById("langJa").classList.toggle("active", lang === "ja");
      applyStaticText();
      renderTables();
      buildCharts();
    }

    function updateThemeBtnLabel() {
      const light = document.body.getAttribute("data-theme") === "light";
      document.getElementById("themeBtn").textContent = light ? L().themeDark : L().themeLight;
    }

    document.getElementById("langVi").addEventListener("click", () => setLang("vi"));
    document.getElementById("langJa").addEventListener("click", () => setLang("ja"));

    document.getElementById("themeBtn").addEventListener("click", () => {
      const body = document.body;
      const light = body.getAttribute("data-theme") === "light";
      body.setAttribute("data-theme", light ? "dark" : "light");
      updateThemeBtnLabel();
      buildCharts();
    });

    setLang("vi");
  </script>
</body>
</html>
